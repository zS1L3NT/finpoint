		<div id="title-start" data-composition-id="title-start" data-composition-src="compositions/title.html" data-start="0" data-duration="2.25" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080" data-variable-values='{"number":"01","title":"Why Finpoint?","level":"The basics"}' style="z-index: 1"></div>
		<div id="run-start-0" data-composition-id="run-start-0" data-composition-src="compositions/scenes/card.html" data-start="1.25" data-duration="7.633" data-track-index="2" data-track-kind="graphics" data-width="1920" data-height="1080" data-variable-values='{"cues":"{}","text":"Your bank keeps a record of every payment you make. What it can’t tell you is what each payment was really for."}' style="z-index: 2"></div>
		<div id="run-start-1" data-composition-id="run-start-1" data-composition-src="compositions/scenes/card.html" data-start="8.383" data-duration="15.433" data-track-index="2" data-track-kind="graphics" data-width="1920" data-height="1080" data-variable-values='{"cues":"{}","text":"Say you spent $80 at the supermarket. $50 of that was groceries, and $30 was a birthday gift for a friend. Your bank shows one $80 payment. But to you, those are two very different things."}' style="z-index: 3"></div>
		<div id="run-start-2" data-composition-id="run-start-2" data-composition-src="compositions/scenes/card.html" data-start="23.317" data-duration="15.433" data-track-index="2" data-track-kind="graphics" data-width="1920" data-height="1080" data-variable-values='{"cues":"{}","text":"Or you paid $90 for dinner with a friend, and they only sent their $60 share back a week later. Your bank shows two entries, a week apart: money out, and money in. What dinner really cost you was $30."}' style="z-index: 4"></div>
		<div id="run-start-3" data-composition-id="run-start-3" data-composition-src="compositions/scenes/card.html" data-start="38.25" data-duration="15.7" data-track-index="2" data-track-kind="graphics" data-width="1920" data-height="1080" data-variable-values='{"cues":"{}","text":"Finpoint closes that gap. It keeps your bank activity exactly as your bank reports it, and lets you explain it in your own words: groceries, $50. A gift, $30. Your share of dinner, $30."}' style="z-index: 5"></div>
		<div id="run-start-4" data-composition-id="run-start-4" data-composition-src="compositions/scenes/card.html" data-start="53.45" data-duration="15.517" data-track-index="2" data-track-kind="graphics" data-width="1920" data-height="1080" data-variable-values='{"cues":"{}","text":"Everything else in Finpoint, from spending charts to budgets, is built on those explanations. So using Finpoint comes down to three things: bring in your bank activity, explain it, and see where your money really went."}' style="z-index: 6"></div>
		<div id="title-model" data-composition-id="title-model" data-composition-src="compositions/title.html" data-start="68.967" data-duration="2.25" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080" data-variable-values='{"number":"02","title":"Statements, Records and Allocations","level":"The basics"}' style="z-index: 1"></div>
		<div id="run-model-0" data-composition-id="run-model-0" data-composition-src="compositions/scenes/card.html" data-start="70.217" data-duration="9.067" data-track-index="2" data-track-kind="graphics" data-width="1920" data-height="1080" data-variable-values='{"cues":"{}","text":"Finpoint uses three words for this, and they’re worth getting to know: Statements, Records and Allocations."}' style="z-index: 2"></div>
		<div id="run-model-1" data-composition-id="run-model-1" data-composition-src="compositions/scenes/card.html" data-start="78.783" data-duration="9.167" data-track-index="2" data-track-kind="graphics" data-width="1920" data-height="1080" data-variable-values='{"cues":"{}","text":"A Statement is one entry of bank activity, exactly as your bank reports it. Like that $80 supermarket payment."}' style="z-index: 3"></div>
		<div id="run-model-2" data-composition-id="run-model-2" data-composition-src="compositions/scenes/card.html" data-start="87.45" data-duration="9.433" data-track-index="2" data-track-kind="graphics" data-width="1920" data-height="1080" data-variable-values='{"cues":"{}","text":"A Record is your explanation of what happened. Groceries for $50 is a Record. The gift for $30 is another."}' style="z-index: 4"></div>
		<div id="run-model-3" data-composition-id="run-model-3" data-composition-src="compositions/scenes/card.html" data-start="96.383" data-duration="14.267" data-track-index="2" data-track-kind="graphics" data-width="1920" data-height="1080" data-variable-values='{"cues":"{}","text":"An Allocation connects a Statement to a Record, and says how much of the Statement belongs there. Here, $50 of the supermarket payment is allocated to Groceries, and the other $30 to the gift."}' style="z-index: 5"></div>
		<div id="run-model-4" data-composition-id="run-model-4" data-composition-src="compositions/scenes/card.html" data-start="110.15" data-duration="8.067" data-track-index="2" data-track-kind="graphics" data-width="1920" data-height="1080" data-variable-values='{"cues":"{}","text":"That’s the first pattern: one Statement, split into several Records. It’s how you untangle a mixed shopping trip."}' style="z-index: 6"></div>
		<div id="run-model-5" data-composition-id="run-model-5" data-composition-src="compositions/scenes/card.html" data-start="117.717" data-duration="16.133" data-track-index="2" data-track-kind="graphics" data-width="1920" data-height="1080" data-variable-values='{"cues":"{}","text":"The second pattern goes the other way: several Statements, combined into one Record. Your $90 dinner payment and your friend’s $60 transfer both belong to one Dinner Record, which comes to your real share: $30."}' style="z-index: 7"></div>
		<div id="run-model-6" data-composition-id="run-model-6" data-composition-src="compositions/scenes/card.html" data-start="133.35" data-duration="9.45" data-track-index="2" data-track-kind="graphics" data-width="1920" data-height="1080" data-variable-values='{"cues":"{}","text":"And most of the time, it’s simply one to one. A $12 lunch is one Statement, explained by one Lunch Record."}' style="z-index: 8"></div>
		<div id="title-import" data-composition-id="title-import" data-composition-src="compositions/title.html" data-start="142.8" data-duration="2.25" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080" data-variable-values='{"number":"03","title":"Importing your bank statements","level":"The basics"}' style="z-index: 1"></div>
		<div id="run-import-0" data-composition-id="run-import-0" data-composition-src="compositions/scenes/card.html" data-start="144.05" data-duration="8.033" data-track-index="2" data-track-kind="graphics" data-width="1920" data-height="1080" data-variable-values='{"cues":"{}","text":"Finpoint starts from your bank’s own records. You download them from your bank, then bring them into Finpoint."}' style="z-index: 2"></div>
		<div id="run-import-1" data-composition-id="run-import-1" data-composition-src="compositions/scenes/card.html" data-start="151.583" data-duration="11.733" data-track-index="2" data-track-kind="graphics" data-width="1920" data-height="1080" data-variable-values='{"cues":"{}","text":"Finpoint can read exports from DBS, OCBC, UOB and Revolut. Depending on the bank, that’s a CSV file or an Excel spreadsheet."}' style="z-index: 3"></div>
		<div id="run-import-2" data-composition-id="run-import-2" data-composition-src="compositions/scenes/card.html" data-start="162.817" data-duration="17.633" data-track-index="2" data-track-kind="graphics" data-width="1920" data-height="1080" data-variable-values='{"cues":"{}","text":"Each Statement belongs to an Account, which simply mirrors one of your bank accounts. Import your OCBC 360 Account and your UOB savings account, and Finpoint keeps their Statements apart, using the account details inside each file."}' style="z-index: 4"></div>
		<div id="run-import-3" data-composition-id="run-import-3" data-composition-src="compositions/scenes/card.html" data-start="179.95" data-duration="9.067" data-track-index="2" data-track-kind="graphics" data-width="1920" data-height="1080" data-variable-values='{"cues":"{}","text":"Some exports, like Revolut’s, don’t say which account they came from. For those, Finpoint asks you to pick or name the account."}' style="z-index: 5"></div>
		<div id="run-import-4" data-composition-id="run-import-4" data-composition-src="compositions/scenes/card.html" data-start="188.517" data-duration="7.567" data-track-index="2" data-track-kind="graphics" data-width="1920" data-height="1080" data-variable-values='{"cues":"{}","text":"Download a CSV or Excel export from your bank, once for each account you want in Finpoint."}' style="z-index: 6"></div>
		<div id="run-import-5" data-composition-id="run-import-5" data-composition-src="compositions/scenes/card.html" data-start="195.583" data-duration="4.233" data-track-index="2" data-track-kind="graphics" data-width="1920" data-height="1080" data-variable-values='{"cues":"{}","text":"Open Importer, choose your bank, and add your files."}' style="z-index: 7"></div>
		<div id="run-import-6" data-composition-id="run-import-6" data-composition-src="compositions/scenes/card.html" data-start="199.317" data-duration="4.467" data-track-index="2" data-track-kind="graphics" data-width="1920" data-height="1080" data-variable-values='{"cues":"{}","text":"Choose Import, and check how many new Statements came in."}' style="z-index: 8"></div>
		<div id="run-import-7" data-composition-id="run-import-7" data-composition-src="compositions/scenes/card.html" data-start="203.283" data-duration="6.283" data-track-index="2" data-track-kind="graphics" data-width="1920" data-height="1080" data-variable-values='{"cues":"{}","text":"Your new Statements are now waiting in Allocator. That’s where we’ll go next."}' style="z-index: 9"></div>
		<div id="title-allocator" data-composition-id="title-allocator" data-composition-src="compositions/title.html" data-start="209.567" data-duration="2.25" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080" data-variable-values='{"number":"04","title":"Meet the Allocator","level":"The basics"}' style="z-index: 1"></div>
		<div id="run-allocator-0" data-composition-id="run-allocator-0" data-composition-src="compositions/scenes/card.html" data-start="210.817" data-duration="9.833" data-track-index="2" data-track-kind="graphics" data-width="1920" data-height="1080" data-variable-values='{"cues":"{}","text":"Allocator is where you’ll spend most of your time in Finpoint. It lists every Statement that still has money left to explain, newest first."}' style="z-index: 2"></div>
		<div id="run-allocator-1" data-composition-id="run-allocator-1" data-composition-src="compositions/scenes/card.html" data-start="220.15" data-duration="10" data-track-index="2" data-track-kind="graphics" data-width="1920" data-height="1080" data-variable-values='{"cues":"{}","text":"When only part of a Statement has been explained, Allocator shows how much is left. Once a Statement is fully explained, it leaves the list."}' style="z-index: 3"></div>
		<div id="run-allocator-2" data-composition-id="run-allocator-2" data-composition-src="compositions/scenes/card.html" data-start="229.65" data-duration="13.35" data-track-index="2" data-track-kind="graphics" data-width="1920" data-height="1080" data-variable-values='{"cues":"{}","text":"Two other pages help you look things up. Statements lists all your bank activity, explained or not. Records lists your explanations. Allocator only shows what’s still waiting."}' style="z-index: 4"></div>
		<div id="title-lunch" data-composition-id="title-lunch" data-composition-src="compositions/title.html" data-start="243" data-duration="2.25" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080" data-variable-values='{"number":"05","title":"Explaining your first purchase","level":"The basics"}' style="z-index: 1"></div>
		<div id="run-lunch-0" data-composition-id="run-lunch-0" data-composition-src="compositions/scenes/card.html" data-start="244.25" data-duration="10.067" data-track-index="2" data-track-kind="graphics" data-width="1920" data-height="1080" data-variable-values='{"cues":"{}","text":"Let’s explain a $12 lunch. In Allocator, click the lunch Statement to select it. A bar appears with what you can do next."}' style="z-index: 2"></div>
		<div id="run-lunch-1" data-composition-id="run-lunch-1" data-composition-src="compositions/scenes/card.html" data-start="253.817" data-duration="7.5" data-track-index="2" data-track-kind="graphics" data-width="1920" data-height="1080" data-variable-values='{"cues":"{}","text":"Choose Create Record. A new Record opens with the Statement already attached, and its amount filled in."}' style="z-index: 3"></div>
		<div id="run-lunch-2" data-composition-id="run-lunch-2" data-composition-src="compositions/scenes/card.html" data-start="260.817" data-duration="5.033" data-track-index="2" data-track-kind="graphics" data-width="1920" data-height="1080" data-variable-values='{"cues":"{}","text":"Give it a title, like Lunch, and pick a Category, like Dining Out."}' style="z-index: 4"></div>
		<div id="run-lunch-3" data-composition-id="run-lunch-3" data-composition-src="compositions/scenes/card.html" data-start="265.35" data-duration="9.433" data-track-index="2" data-track-kind="graphics" data-width="1920" data-height="1080" data-variable-values='{"cues":"{}","text":"You’ll also see Treatment and Spending bucket. Leave those alone for now: your Category fills them in, and we’ll come back to them later."}' style="z-index: 5"></div>
		<div id="run-lunch-4" data-composition-id="run-lunch-4" data-composition-src="compositions/scenes/card.html" data-start="274.283" data-duration="7.783" data-track-index="2" data-track-kind="graphics" data-width="1920" data-height="1080" data-variable-values='{"cues":"{}","text":"Choose Create Record to save. The lunch Statement leaves Allocator, because it’s fully explained."}' style="z-index: 6"></div>
		<div id="title-split" data-composition-id="title-split" data-composition-src="compositions/title.html" data-start="282.067" data-duration="2.25" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080" data-variable-values='{"number":"06","title":"Splitting one payment","level":"The basics"}' style="z-index: 1"></div>
		<div id="run-split-0" data-composition-id="run-split-0" data-composition-src="compositions/scenes/card.html" data-start="283.317" data-duration="7.4" data-track-index="2" data-track-kind="graphics" data-width="1920" data-height="1080" data-variable-values='{"cues":"{}","text":"Back to the $80 supermarket trip. Select it in Allocator, and choose Create Record."}' style="z-index: 2"></div>
		<div id="run-split-1" data-composition-id="run-split-1" data-composition-src="compositions/scenes/card.html" data-start="290.217" data-duration="10.967" data-track-index="2" data-track-kind="graphics" data-width="1920" data-height="1080" data-variable-values='{"cues":"{}","text":"Call it Groceries, and change both the Record’s amount and the Statement’s Allocation to $50. The other $30 stays unexplained for now."}' style="z-index: 3"></div>
		<div id="run-split-2" data-composition-id="run-split-2" data-composition-src="compositions/scenes/card.html" data-start="300.683" data-duration="6.233" data-track-index="2" data-track-kind="graphics" data-width="1920" data-height="1080" data-variable-values='{"cues":"{}","text":"Save, and the supermarket Statement stays in Allocator, with $30 left."}' style="z-index: 4"></div>
		<div id="run-split-3" data-composition-id="run-split-3" data-composition-src="compositions/scenes/card.html" data-start="306.417" data-duration="9.533" data-track-index="2" data-track-kind="graphics" data-width="1920" data-height="1080" data-variable-values='{"cues":"{}","text":"Select it again, and create a second Record, Birthday gift, for the $30 left to allocate. Finpoint fills that amount in for you."}' style="z-index: 5"></div>
		<div id="run-split-4" data-composition-id="run-split-4" data-composition-src="compositions/scenes/card.html" data-start="315.45" data-duration="6.6" data-track-index="2" data-track-kind="graphics" data-width="1920" data-height="1080" data-variable-values='{"cues":"{}","text":"Save, and the supermarket Statement leaves Allocator, because it’s now fully explained."}' style="z-index: 6"></div>
		<div id="run-split-5" data-composition-id="run-split-5" data-composition-src="compositions/scenes/card.html" data-start="321.55" data-duration="8.75" data-track-index="2" data-track-kind="graphics" data-width="1920" data-height="1080" data-variable-values='{"cues":"{}","text":"Now one Statement is explained by two Records: $50 of groceries, and a $30 gift."}' style="z-index: 7"></div>
		<div id="title-repayment" data-composition-id="title-repayment" data-composition-src="compositions/title.html" data-start="330.3" data-duration="2.25" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080" data-variable-values='{"number":"07","title":"Combining payments into one Record","level":"The basics"}' style="z-index: 1"></div>
		<div id="run-repayment-0" data-composition-id="run-repayment-0" data-composition-src="compositions/scenes/card.html" data-start="331.55" data-duration="13.833" data-track-index="2" data-track-kind="graphics" data-width="1920" data-height="1080" data-variable-values='{"cues":"{}","text":"Now the shared dinner. In Allocator, select both Statements: the $90 you paid, and the $60 your friend sent back. The bar shows their total: $30."}' style="z-index: 2"></div>
		<div id="run-repayment-1" data-composition-id="run-repayment-1" data-composition-src="compositions/scenes/card.html" data-start="344.883" data-duration="9.4" data-track-index="2" data-track-kind="graphics" data-width="1920" data-height="1080" data-variable-values='{"cues":"{}","text":"Choose Create Record, and call it Dinner with Sam. Both Statements are attached, and the Record comes to $30, your real share."}' style="z-index: 3"></div>
		<div id="run-repayment-2" data-composition-id="run-repayment-2" data-composition-src="compositions/scenes/card.html" data-start="353.783" data-duration="10.417" data-track-index="2" data-track-kind="graphics" data-width="1920" data-height="1080" data-variable-values='{"cues":"{}","text":"Save, and two Statements are explained by a single Record. Your spending shows the $30 you really spent, not $90."}' style="z-index: 4"></div>
		<div id="title-dashboard" data-composition-id="title-dashboard" data-composition-src="compositions/title.html" data-start="364.2" data-duration="2.25" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080" data-variable-values='{"number":"08","title":"Where your numbers come from","level":"The basics"}' style="z-index: 1"></div>
		<div id="run-dashboard-0" data-composition-id="run-dashboard-0" data-composition-src="compositions/scenes/card.html" data-start="365.45" data-duration="10.1" data-track-index="2" data-track-kind="graphics" data-width="1920" data-height="1080" data-variable-values='{"cues":"{}","text":"With a few Records saved, your Dashboard starts to fill in. Everything on it is calculated from Records, never directly from Statements."}' style="z-index: 2"></div>
		<div id="run-dashboard-1" data-composition-id="run-dashboard-1" data-composition-src="compositions/scenes/card.html" data-start="375.05" data-duration="7.633" data-track-index="2" data-track-kind="graphics" data-width="1920" data-height="1080" data-variable-values='{"cues":"{}","text":"That’s why importing alone leaves the Dashboard empty. A Statement only counts once you’ve explained it."}' style="z-index: 3"></div>
		<div id="run-dashboard-2" data-composition-id="run-dashboard-2" data-composition-src="compositions/scenes/card.html" data-start="382.183" data-duration="11.167" data-track-index="2" data-track-kind="graphics" data-width="1920" data-height="1080" data-variable-values='{"cues":"{}","text":"And because it uses your explanations, the Dashboard shows what you really spent: $30 on dinner, not $90, and groceries apart from the gift."}' style="z-index: 4"></div>
		<div id="run-dashboard-3" data-composition-id="run-dashboard-3" data-composition-src="compositions/scenes/card.html" data-start="392.85" data-duration="7.717" data-track-index="2" data-track-kind="graphics" data-width="1920" data-height="1080" data-variable-values='{"cues":"{}","text":"Your spending is broken down by Category, so the Categories you choose shape everything you see here."}' style="z-index: 5"></div>
		<div id="title-pending" data-composition-id="title-pending" data-composition-src="compositions/title.html" data-start="400.567" data-duration="2.25" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080" data-variable-values='{"number":"09","title":"Pending Records","level":"Going further"}' style="z-index: 1"></div>
		<div id="run-pending-0" data-composition-id="run-pending-0" data-composition-src="compositions/scenes/card.html" data-start="401.817" data-duration="7.2" data-track-index="2" data-track-kind="graphics" data-width="1920" data-height="1080" data-variable-values='{"cues":"{}","text":"Sometimes you know about spending before your bank shows all of it. Finpoint lets you record it anyway."}' style="z-index: 2"></div>
		<div id="run-pending-1" data-composition-id="run-pending-1" data-composition-src="compositions/scenes/card.html" data-start="408.517" data-duration="14.167" data-track-index="2" data-track-kind="graphics" data-width="1920" data-height="1080" data-variable-values='{"cues":"{}","text":"Say you paid $200 for two concert tickets, and your friend Jo will pay you back $100 next week. You can already create the Record for your $100 share, from the $200 payment."}' style="z-index: 3"></div>
		<div id="run-pending-2" data-composition-id="run-pending-2" data-composition-src="compositions/scenes/card.html" data-start="422.183" data-duration="9.2" data-track-index="2" data-track-kind="graphics" data-width="1920" data-height="1080" data-variable-values='{"cues":"{}","text":"The amounts don’t match yet, $100 against $200. Finpoint warns you, and saves the Record as Pending."}' style="z-index: 4"></div>
		<div id="run-pending-3" data-composition-id="run-pending-3" data-composition-src="compositions/scenes/card.html" data-start="430.883" data-duration="5.6" data-track-index="2" data-track-kind="graphics" data-width="1920" data-height="1080" data-variable-values='{"cues":"{}","text":"Pending Records are marked in your Records list, so nothing gets forgotten."}' style="z-index: 5"></div>
		<div id="run-pending-4" data-composition-id="run-pending-4" data-composition-src="compositions/scenes/card.html" data-start="435.983" data-duration="11.433" data-track-index="2" data-track-kind="graphics" data-width="1920" data-height="1080" data-variable-values='{"cues":"{}","text":"When Jo’s $100 arrives, select it in Allocator and choose Attach to Record. Finpoint suggests the Pending Record it matches exactly."}' style="z-index: 6"></div>
		<div id="run-pending-5" data-composition-id="run-pending-5" data-composition-src="compositions/scenes/card.html" data-start="446.917" data-duration="7.5" data-track-index="2" data-track-kind="graphics" data-width="1920" data-height="1080" data-variable-values='{"cues":"{}","text":"The Record now combines both payments. Save, and because the amounts match, it’s no longer Pending."}' style="z-index: 7"></div>
		<div id="run-pending-6" data-composition-id="run-pending-6" data-composition-src="compositions/scenes/card.html" data-start="453.917" data-duration="17.95" data-track-index="2" data-track-kind="graphics" data-width="1920" data-height="1080" data-variable-values='{"cues":"{}","text":"So a Record is Pending for one of two reasons. Its amounts don’t match yet, like the concert. Or it relies on bank activity you’re still expecting, like a sofa balance due on delivery. Either way, Pending means the Record isn’t fully confirmed yet."}' style="z-index: 8"></div>
		<div id="title-pending-statements" data-composition-id="title-pending-statements" data-composition-src="compositions/title.html" data-start="471.867" data-duration="2.25" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080" data-variable-values='{"number":"10","title":"Pending Statements","level":"Going further"}' style="z-index: 1"></div>
		<div id="run-pending-statements-0" data-composition-id="run-pending-statements-0" data-composition-src="compositions/scenes/card.html" data-start="473.117" data-duration="11.167" data-track-index="2" data-track-kind="graphics" data-width="1920" data-height="1080" data-variable-values='{"cues":"{}","text":"Some banks take days to show a card payment. If you want it explained today, create a Pending Statement: a placeholder for bank activity you’re expecting."}' style="z-index: 2"></div>
		<div id="run-pending-statements-1" data-composition-id="run-pending-statements-1" data-composition-src="compositions/scenes/card.html" data-start="483.783" data-duration="8.433" data-track-index="2" data-track-kind="graphics" data-width="1920" data-height="1080" data-variable-values='{"cues":"{}","text":"On the Statements page, choose Create Pending Statement. Pick the account, then enter the amount and a short description."}' style="z-index: 3"></div>
		<div id="run-pending-statements-2" data-composition-id="run-pending-statements-2" data-composition-src="compositions/scenes/card.html" data-start="491.717" data-duration="11.3" data-track-index="2" data-track-kind="graphics" data-width="1920" data-height="1080" data-variable-values='{"cues":"{}","text":"It appears in Allocator, marked Pending. Explain it like any other Statement. The Record counts straight away, but stays Pending while it relies on a placeholder."}' style="z-index: 4"></div>
		<div id="run-pending-statements-3" data-composition-id="run-pending-statements-3" data-composition-src="compositions/scenes/card.html" data-start="502.517" data-duration="11.2" data-track-index="2" data-track-kind="graphics" data-width="1920" data-height="1080" data-variable-values='{"cues":"{}","text":"When the real Statement is imported, open Replace Pending in Allocator. Pick the placeholder, and Finpoint suggests the imported Statements it could become."}' style="z-index: 5"></div>
		<div id="run-pending-statements-4" data-composition-id="run-pending-statements-4" data-composition-src="compositions/scenes/card.html" data-start="513.217" data-duration="9.45" data-track-index="2" data-track-kind="graphics" data-width="1920" data-height="1080" data-variable-values='{"cues":"{}","text":"Choose Replace. The Allocations move to the real Statement, the placeholder disappears, and nothing is counted twice."}' style="z-index: 6"></div>
		<div id="title-categories" data-composition-id="title-categories" data-composition-src="compositions/title.html" data-start="522.667" data-duration="2.25" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080" data-variable-values='{"number":"11","title":"Categories","level":"Going further"}' style="z-index: 1"></div>
		<div id="run-categories-0" data-composition-id="run-categories-0" data-composition-src="compositions/scenes/card.html" data-start="523.917" data-duration="9.033" data-track-index="2" data-track-kind="graphics" data-width="1920" data-height="1080" data-variable-values='{"cues":"{}","text":"Categories are the most important choice you make on a Record. They say what it was for, and the Dashboard breaks your spending down by them."}' style="z-index: 2"></div>
		<div id="run-categories-1" data-composition-id="run-categories-1" data-composition-src="compositions/scenes/card.html" data-start="532.45" data-duration="15.033" data-track-index="2" data-track-kind="graphics" data-width="1920" data-height="1080" data-variable-values='{"cues":"{}","text":"Lunch and dinner with friends are Dining Out. The supermarket run is Groceries. The birthday gift goes under Gifts and Donations. Finpoint starts you with a sensible set, and you can rename them or add your own."}' style="z-index: 3"></div>
		<div id="run-categories-2" data-composition-id="run-categories-2" data-composition-src="compositions/scenes/card.html" data-start="546.983" data-duration="11.583" data-track-index="2" data-track-kind="graphics" data-width="1920" data-height="1080" data-variable-values='{"cues":"{}","text":"Each Category also carries two defaults: a treatment, and a spending bucket. That’s why you could ignore those fields earlier. The Category fills them in."}' style="z-index: 4"></div>
		<div id="title-treatments" data-composition-id="title-treatments" data-composition-src="compositions/title.html" data-start="558.567" data-duration="2.25" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080" data-variable-values='{"number":"12","title":"Treatments","level":"Advanced"}' style="z-index: 1"></div>
		<div id="run-treatments-0" data-composition-id="run-treatments-0" data-composition-src="compositions/scenes/card.html" data-start="559.817" data-duration="8.067" data-track-index="2" data-track-kind="graphics" data-width="1920" data-height="1080" data-variable-values='{"cues":"{}","text":"Treatment decides how the Dashboard counts a Record: as income, as spending, as saving, or not at all."}' style="z-index: 2"></div>
		<div id="run-treatments-1" data-composition-id="run-treatments-1" data-composition-src="compositions/scenes/card.html" data-start="567.383" data-duration="18.067" data-track-index="2" data-track-kind="graphics" data-width="1920" data-height="1080" data-variable-values='{"cues":"{}","text":"Your salary is Income. Lunch and groceries are Spending, and so is a refund, which lowers what you spent. Moving $500 into savings is Saving/investment. And moving money between your own accounts is a Transfer, which isn’t counted at all."}' style="z-index: 3"></div>
		<div id="run-treatments-2" data-composition-id="run-treatments-2" data-composition-src="compositions/scenes/card.html" data-start="584.95" data-duration="12.567" data-track-index="2" data-track-kind="graphics" data-width="1920" data-height="1080" data-variable-values='{"cues":"{}","text":"On the Dashboard, Income and Spending make up your totals and charts. Saving and investment is kept out of them, in its own section at the bottom. And Transfers don’t appear at all."}' style="z-index: 4"></div>
		<div id="run-treatments-3" data-composition-id="run-treatments-3" data-composition-src="compositions/scenes/card.html" data-start="597.017" data-duration="8.35" data-track-index="2" data-track-kind="graphics" data-width="1920" data-height="1080" data-variable-values='{"cues":"{}","text":"Your Category sets the treatment for you. Change it on a single Record only when that Record is an exception."}' style="z-index: 5"></div>
		<div id="title-buckets" data-composition-id="title-buckets" data-composition-src="compositions/title.html" data-start="605.367" data-duration="2.25" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080" data-variable-values='{"number":"13","title":"Spending buckets and monthly targets","level":"Advanced"}' style="z-index: 1"></div>
		<div id="run-buckets-0" data-composition-id="run-buckets-0" data-composition-src="compositions/scenes/card.html" data-start="606.617" data-duration="13.7" data-track-index="2" data-track-kind="graphics" data-width="1920" data-height="1080" data-variable-values='{"cues":"{}","text":"A spending bucket groups your spending for monthly planning. Think of it as a monthly budget that repeats. Finpoint starts you with four: Daily, Recurring, Irregular and Travel."}' style="z-index: 2"></div>
		<div id="run-buckets-1" data-composition-id="run-buckets-1" data-composition-src="compositions/scenes/card.html" data-start="619.817" data-duration="9.033" data-track-index="2" data-track-kind="graphics" data-width="1920" data-height="1080" data-variable-values='{"cues":"{}","text":"Daily is the one to watch. It holds everyday spending, like food and transport, and the Dashboard paces it through the month."}' style="z-index: 3"></div>
		<div id="run-buckets-2" data-composition-id="run-buckets-2" data-composition-src="compositions/scenes/card.html" data-start="628.35" data-duration="9.167" data-track-index="2" data-track-kind="graphics" data-width="1920" data-height="1080" data-variable-values='{"cues":"{}","text":"Give a bucket a monthly target, say $500 for Daily. You can set it for one month only, or from this month onward."}' style="z-index: 4"></div>
		<div id="run-buckets-3" data-composition-id="run-buckets-3" data-composition-src="compositions/scenes/card.html" data-start="637.017" data-duration="9.35" data-track-index="2" data-track-kind="graphics" data-width="1920" data-height="1080" data-variable-values='{"cues":"{}","text":"The Dashboard then shows how this month is going against the target. Targets don’t move any money. They’re simply a comparison."}' style="z-index: 5"></div>
		<div id="title-budgets" data-composition-id="title-budgets" data-composition-src="compositions/title.html" data-start="646.367" data-duration="2.25" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080" data-variable-values='{"number":"14","title":"Budgets for trips and events","level":"Advanced"}' style="z-index: 1"></div>
		<div id="run-budgets-0" data-composition-id="run-budgets-0" data-composition-src="compositions/scenes/card.html" data-start="647.617" data-duration="7.433" data-track-index="2" data-track-kind="graphics" data-width="1920" data-height="1080" data-variable-values='{"cues":"{}","text":"A Budget is for spending with its own start and end, like a week in Bali, or a wedding."}' style="z-index: 2"></div>
		<div id="run-budgets-1" data-composition-id="run-budgets-1" data-composition-src="compositions/scenes/card.html" data-start="654.55" data-duration="13.633" data-track-index="2" data-track-kind="graphics" data-width="1920" data-height="1080" data-variable-values='{"cues":"{}","text":"Create one with a name, an amount and its dates. Leave Automatic attach on, and Records dated inside the period are attached for you: the ones you already have, and new ones as you add them."}' style="z-index: 3"></div>
		<div id="run-budgets-2" data-composition-id="run-budgets-2" data-composition-src="compositions/scenes/card.html" data-start="667.683" data-duration="11.55" data-track-index="2" data-track-kind="graphics" data-width="1920" data-height="1080" data-variable-values='{"cues":"{}","text":"A Budget is its own small dashboard for that period: what you’ve spent, what’s left, and your pace. It’s separate from your monthly Dashboard, and doesn’t change it."}' style="z-index: 4"></div>
		<div id="title-sync" data-composition-id="title-sync" data-composition-src="compositions/title.html" data-start="679.233" data-duration="2.25" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080" data-variable-values='{"number":"15","title":"Backups and Google Drive","level":"Your data"}' style="z-index: 1"></div>
		<div id="run-sync-0" data-composition-id="run-sync-0" data-composition-src="compositions/scenes/card.html" data-start="680.483" data-duration="11.667" data-track-index="2" data-track-kind="graphics" data-width="1920" data-height="1080" data-variable-values='{"cues":"{}","text":"Finpoint keeps your data in this browser, on this device. There’s no Finpoint database, and your finances never pass through our servers, so we never see them."}' style="z-index: 2"></div>
		<div id="run-sync-1" data-composition-id="run-sync-1" data-composition-src="compositions/scenes/card.html" data-start="691.65" data-duration="13.4" data-track-index="2" data-track-kind="graphics" data-width="1920" data-height="1080" data-variable-values='{"cues":"{}","text":"That means keeping a copy is up to you, and there are two ways. The first is a backup file. Download it from the Data page whenever you like, and restore it later, on this device or a new one."}' style="z-index: 3"></div>
		<div id="run-sync-2" data-composition-id="run-sync-2" data-composition-src="compositions/scenes/card.html" data-start="704.55" data-duration="11.3" data-track-index="2" data-track-kind="graphics" data-width="1920" data-height="1080" data-variable-values='{"cues":"{}","text":"The second is Google Drive. Connect it once, and Finpoint keeps a copy in a hidden folder in your own Drive, automatically, so your devices stay in step."}' style="z-index: 4"></div>
		<div id="run-sync-3" data-composition-id="run-sync-3" data-composition-src="compositions/scenes/card.html" data-start="715.35" data-duration="5.35" data-track-index="2" data-track-kind="graphics" data-width="1920" data-height="1080" data-variable-values='{"cues":"{}","text":"Either way, your data only goes to places you control."}' style="z-index: 5"></div>
		<div id="title-routine" data-composition-id="title-routine" data-composition-src="compositions/title.html" data-start="720.7" data-duration="2.25" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080" data-variable-values='{"number":"16","title":"Your routine","level":"Your data"}' style="z-index: 1"></div>
		<div id="run-routine-0" data-composition-id="run-routine-0" data-composition-src="compositions/scenes/card.html" data-start="721.95" data-duration="11.467" data-track-index="2" data-track-kind="graphics" data-width="1920" data-height="1080" data-variable-values='{"cues":"{}","text":"Here’s a routine that works. Import your latest statements. Explain what’s new in Allocator. Check anything Pending. Glance at your Dashboard. And keep a backup."}' style="z-index: 2"></div>
		<div id="run-routine-1" data-composition-id="run-routine-1" data-composition-src="compositions/scenes/card.html" data-start="732.917" data-duration="8.233" data-track-index="2" data-track-kind="graphics" data-width="1920" data-height="1080" data-variable-values='{"cues":"{}","text":"With Google Drive connected, that happens automatically. If not, download a backup file every so often."}' style="z-index: 3"></div>
		<div id="run-routine-2" data-composition-id="run-routine-2" data-composition-src="compositions/scenes/card.html" data-start="740.65" data-duration="8.383" data-track-index="2" data-track-kind="graphics" data-width="1920" data-height="1080" data-variable-values='{"cues":"{}","text":"And whenever you’re unsure, open Help from any page or form. Every chapter of this guide is there, with pictures."}' style="z-index: 4"></div>
